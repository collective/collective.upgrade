# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[gitignore]
extra_lines = """
htmlcov/
*.log
output.xml
report.html
"""

[tox]
test_environment_variables = """
    # Playwright (rfbrowser init) does not know ubuntu-latest 26.04 yet
    PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
"""
test_matrix = {"6.3" = ["*"], "6.2" = ["*"]}

[pyproject]
dependencies_ignores = "['experimental.broken', 'plone.app.caching', 'plonetheme.barceloneta', 'Products.PluginIndexes']"
extra_lines = """
[tool.towncrier]
filename = "CHANGES.rst"
directory = "news/"
title_format = "{version} ({project_date})"
underlines = ["-", ""]
issue_format = "`#{issue} <https://github.com/collective/collective.upgrade/issues/{issue}>`_"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true
"""
